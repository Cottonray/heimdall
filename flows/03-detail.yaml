# 상품 상세 확인 — 상품 하나를 열었을 때 선택한 상품의 상세 내용이 맞게 표시되는지 확인해요.
appId: com.aidemo.golmok
---
- launchApp:
    clearState: true
- tapOn: "원목 접이식 테이블"
- assertVisible: "모퉁이햇살"
# 화면에는 "40.2℃ 골목온도" 로 한 덩어리다. Maestro 는 부분 일치를 하지 않으므로
# 정규식으로 감싼다 (adb 갈래도 같은 규칙을 쓴다 — runner.ts matchesText)
- assertVisible: ".*골목온도.*"
- assertVisible: "채팅"
