# 관심 카테고리와 고객센터 — 카테고리를 고르면 개수가 세지고, 문의를 보내면 접수 안내가 남는지 확인해요.
appId: com.aidemo.golmok
---
- launchApp:
    clearState: true
- tapOn:
    id: "tab_4"
- tapOn:
    id: "menu_3"
- assertVisible: "0개 선택"
- tapOn:
    id: "chip_가구"
- tapOn:
    id: "chip_도서"
- assertVisible: "2개 선택"
- back
# 고객센터는 나의 골목 목록의 여섯째 줄이라 720x1600 에서는 탭바 아래(y 1392 너머)에 있다 —
# 굴리지 않으면 uiautomator 트리에 없어 "못 찾았어요"로 떨어진다 (2026-09-07 실측)
- scrollUntilVisible:
    element:
      text: "고객센터"
- tapOn:
    id: "menu_5"
- tapOn:
    id: "faq_0"
- assertVisible: "채팅으로 시간과 장소를 정해요. 서로 확인하기 쉬운 곳을 골라 주세요."
- tapOn:
    id: "inquiry_submit"
- assertVisible: "문의 내용을 입력해 주세요."
- tapOn:
    id: "inquiry_input"
- inputText: "거래 후기는 어디서 보나요"
- tapOn:
    id: "inquiry_submit"
- assertVisible: "문의가 접수됐어요."
