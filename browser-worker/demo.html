<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>샘플 뱅킹 · QA 테스트</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#19253c;font:17px system-ui}main{max-width:650px;margin:40px auto;padding:28px}small{color:#64748b}h1{font-size:32px}section{background:white;border-radius:20px;padding:28px;margin:20px 0;box-shadow:0 8px 30px #20304c08}button{border:0;border-radius:12px;padding:15px 22px;background:#375ef7;color:white;font-size:16px;cursor:pointer}input{width:100%;padding:15px;border:1px solid #d2d9e5;border-radius:10px;margin:10px 0 20px;font-size:17px}label{display:block}nav{display:flex;gap:10px}nav button{background:#e6ebff;color:#2442b0}.balance{font-size:36px;font-weight:700}#result{color:#227349}footer{font-size:13px;color:#64748b}</style>
<main><small>AI QA · 연습용 서비스</small><h1>샘플 뱅킹</h1><nav><button id="accounts" onclick="show('account')">계좌 조회</button><button id="transfer" onclick="show('send')">이체</button></nav><section id="account"><small>QA 테스트 계좌</small><p class="balance">1,250,000원</p><p>테스트 전용 데이터예요.</p></section><section id="send" hidden><h2>이체 정보</h2><label for="recipient">받는 사람</label><input id="recipient" placeholder="예: 김테스트"><label for="amount">금액</label><input id="amount" inputmode="numeric" placeholder="예: 10000"><button id="review" onclick="review()">입력 확인</button><p id="result" role="status"></p></section><footer>실제 금융 거래가 발생하지 않는 QA 샘플이에요.</footer></main>
<script>function show(id){document.querySelectorAll('section').forEach(x=>x.hidden=x.id!==id);console.log('screen',id)}function review(){const r=document.querySelector('#recipient').value,a=Number(document.querySelector('#amount').value);document.querySelector('#result').textContent=r&&a>0?`${r}님 · ${a.toLocaleString()}원 · 입력 확인 완료`:'받는 사람과 금액을 입력해 주세요';console.log('transfer reviewed')}fetch('/demo/api/accounts').then(r=>r.json()).then(()=>console.log('accounts loaded'))</script></html>
