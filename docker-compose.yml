name: aiqa

# **홈서버에서 돈다** (`ssh heimdall-host`). 메인서버 compose 와 아무것도 공유하지 않는다.
#
# 반영:  ./deploy/aiqa/deploy.sh   (로컬 맥에서 실행)
# 주소:  https://qa.example/aiqa/  (edge nginx 가 넘긴다)

services:
  aiqa-terminal:
    image: node:24-bookworm
    container_name: aiqa-terminal
    user: "1001:1001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    entrypoint: ["node", "/opt/aiqa/server/src/terminal/bridge.ts"]
    tmpfs: ["/tmp:uid=1001,gid=1001,mode=1777"]
    volumes:
      - aiqa-codex:/home/codex
      - ./server/src/terminal:/opt/aiqa/server/src/terminal:ro
      - ./server/src/ws.ts:/opt/aiqa/server/src/ws.ts:ro
      - ./server/codex/bin/codex:/opt/aiqa/server/codex/bin/codex:ro
      - ./terminal-runtime/node_modules:/opt/aiqa/node_modules:ro
      - ./runs/.terminal-key:/run/terminal-key:ro
    networks: [terminal]
  aiqa-browser:
    build:
      context: .
      dockerfile: browser-worker/Dockerfile
    image: aiqa-browser:1.63.0
    container_name: aiqa-browser
    init: true
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 512m
    environment:
      AIQA_WORKER_SECRET: ${AIQA_WORKER_SECRET:?AIQA_WORKER_SECRET required}
      AIQA_TEST_ORIGINS: ${AIQA_TEST_ORIGINS:-http://127.0.0.1:8081}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  # 시나리오별 걸린 시간 기록 (2026-09-30 timings.json 에서 옮겼다 — docs/rules.md §데이터베이스).
  # 증적(스크린샷·xlsx)은 파일이 결과물이라 여기 두지 않는다. 비밀번호는 홈서버 ~/aiqa/db.env 에만 있다
  aiqa-db:
    image: postgres:16-alpine
    container_name: aiqa-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: aiqa
      POSTGRES_USER: aiqa
      POSTGRES_PASSWORD: ${AIQA_DB_PASSWORD:?AIQA_DB_PASSWORD 가 없어요 — deploy.sh 가 ~/aiqa/db.env 를 만듭니다}
    volumes:
      - aiqa-db-data:/var/lib/postgresql/data
    # edge 에 붙이지 않는다. DB 는 aiqa 말고 아무도 부를 일이 없다
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqa -d aiqa"]
      interval: 10s
      timeout: 5s
      retries: 30

  aiqa:
    image: aiqa:${IMAGE_TAG:-latest}
    container_name: aiqa
    # Force modem simulator loopback onto IPv4 inside this container.
    sysctls:
      net.ipv6.conf.lo.disable_ipv6: 1
    init: true
    restart: unless-stopped
    # **에뮬레이터 한 대가 이 상자 안에 있다.** 안드로이드에 2GB, 나머지가 Maestro 의
    # JVM · Appium(Node) · ffmpeg · 우리 서버 몫이다. 이보다 조이면 시나리오가 도는 동안
    # OOM 으로 기기가 죽는다.
    mem_limit: 8g
    depends_on:
      aiqa-db:
        condition: service_healthy
    # 하드웨어 가속이 없으면 에뮬레이터가 부팅에만 십 분씩 걸린다. `-accel on` 이라
    # 이 장치가 없으면 아예 뜨지 않는다 — 조용히 느려지는 것보다 낫다.
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      # nginx 는 접두사를 떼지 않는다 — 앱이 자기 경로를 안다 (홈서버 규약)
      AIQA_BASE_PATH: /aiqa
      AIQA_PORT: 8080
      AIQA_SOURCE_HOSTS: ${AIQA_SOURCE_HOSTS:-github.com,gitlab.com,svn.apache.org}
      AIQA_WORKER_SECRET: ${AIQA_WORKER_SECRET:?AIQA_WORKER_SECRET required}
      AIQA_TEST_LOGIN_ENABLED: ${AIQA_TEST_LOGIN_ENABLED:-false}
      AIQA_TEST_USER_PASSWORD: ${AIQA_TEST_USER_PASSWORD:-}
      AIQA_TEST_ADMIN_PASSWORD: ${AIQA_TEST_ADMIN_PASSWORD:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-example-media}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_KEY_PREFIX: heimdall
      AIQA_BROWSER_WORKER_URL: http://aiqa-browser:8081
      AIQA_WEB_DIR: /opt/aiqa/web
      AIQA_FLOW_DIR: /opt/aiqa/flows
      # 시작할 때 보는 기기. 상시로 떠 있는 것은 에뮬레이터 하나다
      AIQA_SERIAL: emulator-5554
      # **공개 화면에서 고를 수 있는 기기.** 실기기를 붙여도 여기 없으면 목록에 "잠김"으로만
      # 보인다 — 주소를 아는 누구나 여는 화면이라, 개인 폰이 그냥 열리면 안 된다.
      # 여는 것은 ./deploy/aiqa/attach-device.sh public 이 한다 (경고를 한 번 더 띄운다)
      AIQA_PUBLIC_SERIALS: ${AIQA_PUBLIC_SERIALS:-emulator-5554}
      AIQA_APP_ID: com.aidemo.golmok
      AIQA_APP_ACTIVITY: .MainActivity
      # 화면 프레임 — 폭·품질·박자. 집 업로드 회선이 정하는 값이다
      AIQA_FRAME_WIDTH: ${AIQA_FRAME_WIDTH:-360}
      AIQA_FRAME_QUALITY: ${AIQA_FRAME_QUALITY:-7}
      AIQA_FRAME_FAST_MS: ${AIQA_FRAME_FAST_MS:-220}
      AIQA_FRAME_SLOW_MS: ${AIQA_FRAME_SLOW_MS:-900}
      # 조작 권한을 놀렸을 때 스스로 놓는 시간
      AIQA_CONTROL_IDLE_MS: ${AIQA_CONTROL_IDLE_MS:-90000}
      # 시간 기록 (server/src/timings.ts)
      AIQA_DATABASE_URL: postgres://aiqa:${AIQA_DB_PASSWORD:?}@aiqa-db:5432/aiqa
      # 남겨 둘 증적 실행 수. 공개 데모라 무한히 쌓게 두지 않는다
      AIQA_RUNS_KEEP: ${AIQA_RUNS_KEEP:-30}
      # 영상 길(server/src/stream.ts). 긴 변 상한·fps·비트레이트, 그리고 지연을 가를 때 켜는 시각 기록
      AIQA_STREAM_MAX_SIZE: ${AIQA_STREAM_MAX_SIZE:-1600}
      AIQA_STREAM_MAX_FPS: ${AIQA_STREAM_MAX_FPS:-24}
      AIQA_STREAM_BIT_RATE: ${AIQA_STREAM_BIT_RATE:-2500000}
      AIQA_STREAM_DEBUG: ${AIQA_STREAM_DEBUG:-0}
      AIQA_STREAM_CODEC_OPTIONS: ${AIQA_STREAM_CODEC_OPTIONS:-latency:int=0,priority:int=0,i-frame-interval:int=1}
      # **카메라에 물릴 것.** image(기본·신분증 촬영) · video(얼굴 인증처럼 움직여야 하는 것) · none
      AIQA_CAMERA_SOURCE: ${AIQA_CAMERA_SOURCE:-image}
      # 세 번째 갈래(Appium). 같은 컨테이너 안이라 loopback 이다 — 밖으로 열지 않는다
      AIQA_APPIUM_URL: ${AIQA_APPIUM_URL:-http://127.0.0.1:4723}
      # 시나리오 하나에 주는 시간 · adb 갈래가 요소를 기다리는 시간
      AIQA_RUN_TIMEOUT_MS: ${AIQA_RUN_TIMEOUT_MS:-240000}
      AIQA_FIND_TIMEOUT_MS: ${AIQA_FIND_TIMEOUT_MS:-8000}
      # 말로 시나리오 만들기·실패 원인 요약. 키가 없으면 그 둘만 꺼지고 나머지는 돈다
      AIQA_OPENROUTER_API_KEY: ${AIQA_OPENROUTER_API_KEY:-}
      AIQA_OPENROUTER_BASE_URL: ${AIQA_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AIQA_LLM_MODEL: ${AIQA_LLM_MODEL:-deepseek/deepseek-v4.1-flash}
    volumes:
      - ./entrypoint.sh:/opt/aiqa/entrypoint.sh:ro
      # **자주 바뀌는 것은 굽지 않는다.** 서버 소스·화면·시나리오를 마운트해 두면
      # 문구 하나 고치자고 3GB 이미지를 다시 만들 일이 없다 (AICC 의 web/ 과 같은 판단)
      - ./server:/opt/aiqa/server:ro
      - ./contracts:/opt/aiqa/contracts:ro
      - ./web:/opt/aiqa/web:ro
      - ./flows:/opt/aiqa/flows:ro
      # AVD 의 상태(설치된 앱·설정). 배포로 컨테이너가 새로 떠도 부팅이 조금 빠르다
      - aiqa-avd:/home/aiqa/.android/avd
      # 증적(xlsx·스크린샷·녹화 mp4). 배포로 컨테이너가 새로 떠도 남는다
      - aiqa-runs:/opt/aiqa/runs
    networks:
      - terminal
      # edge nginx 가 http://aiqa:8080 으로 붙는다
      - edge
      - internal
    healthcheck:
      # **기기가 아니라 서버를 본다.** 부팅에 1~2분이 걸리는데 그동안 unhealthy 로
      # 재시작하면 영원히 못 뜬다 — 기기 상태는 화면이 알려 준다
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  aiqa-codex:
  aiqa-avd:
  aiqa-runs:
  aiqa-db-data:

networks:
  terminal:
    internal: true
  internal:
  edge:
    external: true
    name: edge
